<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 830" width="1520" height="830" role="img" aria-label="Anvaya AI high-level design: browser, Flask API, Supabase data, optional services, planned items and operations"><style>text{font-family:"Segoe UI","Noto Sans",Arial,sans-serif}.band{font-size:15px;font-weight:700}.title{font-size:16px;font-weight:700}.sub{font-size:13.5px}.lbl{font-size:12px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1520" height="830" fill="#ffffff"/><rect x="20" y="20" width="1040" height="150" rx="16" fill="#f3f8fd" stroke="#155e9c" stroke-width="1.5"/><text x="38" y="46" class="band" fill="#155e9c">Browser and kiosk PWA (React + Vite)</text><rect x="50" y="62" width="300" height="84" rx="10" fill="#e3eef9" stroke="#155e9c" stroke-width="1.6"/><text x="200.0" y="84.0" text-anchor="middle" class="title" fill="#10243a">Citizen · Kiosk operator</text><text x="200.0" y="104.0" text-anchor="middle" class="sub" fill="#10243a">Reviewer · Admin</text><text x="200.0" y="124.0" text-anchor="middle" class="sub" fill="#10243a">three languages</text><rect x="400" y="62" width="300" height="84" rx="10" fill="#e3eef9" stroke="#155e9c" stroke-width="1.6"/><text x="550.0" y="94.0" text-anchor="middle" class="title" fill="#10243a">Voice in and out</text><text x="550.0" y="114.0" text-anchor="middle" class="sub" fill="#10243a">VerbX → browser speech → typing</text><rect x="750" y="62" width="290" height="84" rx="10" fill="#e3eef9" stroke="#155e9c" stroke-width="1.6"/><text x="895.0" y="94.0" text-anchor="middle" class="title" fill="#10243a">Offline pre-screen</text><text x="895.0" y="114.0" text-anchor="middle" class="sub" fill="#10243a">cached rule bundle + outbox</text><rect x="20" y="215" width="1040" height="365" rx="16" fill="#f4faf5" stroke="#1f7a3a" stroke-width="1.5"/><text x="350" y="241" class="band" fill="#1f7a3a">Flask API (gunicorn, 1 worker × 8 threads)</text><rect x="50" y="255" width="250" height="84" rx="10" fill="#e2f3e6" stroke="#1f7a3a" stroke-width="1.6"/><text x="175.0" y="277.0" text-anchor="middle" class="title" fill="#10281a">Auth</text><text x="175.0" y="297.0" text-anchor="middle" class="sub" fill="#10281a">JWT checked on every request</text><text x="175.0" y="317.0" text-anchor="middle" class="sub" fill="#10281a">TOTP for staff</text><rect x="370" y="255" width="300" height="84" rx="10" fill="#e2f3e6" stroke="#1f7a3a" stroke-width="1.6"/><text x="520.0" y="277.0" text-anchor="middle" class="title" fill="#10281a">Conversation</text><text x="520.0" y="297.0" text-anchor="middle" class="sub" fill="#10281a">rules extractor + optional LLM</text><text x="520.0" y="317.0" text-anchor="middle" class="sub" fill="#10281a">always confirmed by the citizen</text><rect x="750" y="255" width="290" height="84" rx="10" fill="#e2f3e6" stroke="#1f7a3a" stroke-width="1.6"/><text x="895.0" y="287.0" text-anchor="middle" class="title" fill="#10281a">Offline sync</text><text x="895.0" y="307.0" text-anchor="middle" class="sub" fill="#10281a">dedupe + re-check</text><rect x="370" y="400" width="300" height="74" rx="10" fill="#e2f3e6" stroke="#1f7a3a" stroke-width="1.6"/><text x="520.0" y="427.0" text-anchor="middle" class="title" fill="#10281a">Rules engine</text><text x="520.0" y="447.0" text-anchor="middle" class="sub" fill="#10281a">pure · versioned · quoted</text><rect x="750" y="400" width="290" height="74" rx="10" fill="#e2f3e6" stroke="#1f7a3a" stroke-width="1.6"/><text x="895.0" y="427.0" text-anchor="middle" class="title" fill="#10281a">Catalogue</text><text x="895.0" y="447.0" text-anchor="middle" class="sub" fill="#10281a">3,534 schemes · 17 reviewed rules</text><rect x="50" y="400" width="250" height="74" rx="10" fill="#e2f3e6" stroke="#1f7a3a" stroke-width="1.6"/><text x="175.0" y="427.0" text-anchor="middle" class="title" fill="#10281