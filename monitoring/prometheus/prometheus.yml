global:
  scrape_interval: 5s        # short for live demo; use 15–30s in production
  evaluation_interval: 15s

scrape_configs:
  - job_name: anvaya
    # The app exports a `job` label of its own (anvaya_job_runs_total{job=...}); without honor_labels Prometheus renames it
    # to exported_job and the job panels stay empty.
    honor_labels: true
    metrics_path: /metrics
    static_configs:
      - targets: ["anvaya:5000"]
        labels:
          service: anvaya-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
