name: Keep-alive

# Supabase pauses free projects after a week without database activity. Once a day this calls the deployed app's
# readiness endpoint, which runs cheap queries (row counts and the RLS check) against the database.
# Needs one repository secret: APP_URL, the public base URL of the deployment (e.g. https://anvaya.example.org).

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/v1/ready
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Repository secret APP_URL is not set"
            exit 1
          fi
          # Retries cover a cold start (free hosting tiers sleep too); the URL is masked as a secret in the log.
          curl --fail --silent --show-error --retry 4 --retry-delay 20 --retry-all-errors --max-time 60 \
            -o ready.json "${APP_URL%/}/api/v1/ready"
          python3 -c "import json; r = json.load(open('ready.json')); print('ready:', r['ready'], '| db:', r['db']['backend'], r['db']['status'], '| schemes:', r['schemes'])"
