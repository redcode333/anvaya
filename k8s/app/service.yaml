apiVersion: v1
kind: Service
metadata:
  name: anvaya
  labels:
    app.kubernetes.io/name: anvaya
spec:
  selector:
    app.kubernetes.io/name: anvaya
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anvaya-data
  labels:
    app.kubernetes.io/name: anvaya
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
