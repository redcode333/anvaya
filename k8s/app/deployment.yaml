apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvaya
  labels:
    app.kubernetes.io/name: anvaya
    app.kubernetes.io/component: api
spec:
  # Single replica by design: the MVP uses SQLite on a ReadWriteOnce volume, an in-process rate limiter
  # and in-process Prometheus counters. Scale out only after moving to PostgreSQL (see k8s/README.md).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: anvaya
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvaya
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anvaya
          image: anvaya-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: anvaya-config
            - secretRef:
                name: anvaya-secrets
          env:
            - name: ANVAYA_DB
              value: /app/var/anvaya.db
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # The first start imports the 3.5k-row catalogue; allow up to ~2 minutes before liveness applies.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/var
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: anvaya-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
